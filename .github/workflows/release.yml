name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vm
      - name: Validate tag version
        run: |
          version="${GITHUB_REF_NAME#v}"
          pom_version="$(./mvnw --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$version" = "$pom_version"
      - name: Verify JVM release
        run: ./mvnw --batch-mode verify
      - name: Verify Rust VM release
        run: |
          cargo fmt --manifest-path vm/Cargo.toml -- --check
          cargo clippy --manifest-path vm/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path vm/Cargo.toml
          cargo build --release --manifest-path vm/Cargo.toml
          .github/scripts/verify-rust-vm.sh "${GITHUB_REF_NAME#v}"
      - name: Verify browser release
        run: |
          ./mvnw --batch-mode -Pbrowser -DskipTests package
          test -s site/runtime/yin.js
          node --check site/app.js
          node --check site/worker.js
          node .github/scripts/browser-runtime-smoke.cjs
      - name: Package editor release
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
      - name: Verify editor release
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/verify-vsix.sh \
            "$version" \
            "editors/vscode/yin-language-support-${version}.vsix"
      - name: Package release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar="yin-${version}.jar"
          vsix="yin-language-support-${version}.vsix"
          yinvm="yinvm-${version}-linux-x86_64"
          test "$(java -jar target/${jar} --version)" = "Yin ${version}"
          mkdir release
          cp "target/${jar}" "release/${jar}"
          cp "editors/vscode/${vsix}" "release/${vsix}"
          cp "vm/target/release/yinvm" "release/${yinvm}"
          cd release
          sha256sum "${jar}" > "${jar}.sha256"
          sha256sum "${vsix}" > "${vsix}.sha256"
          sha256sum "${yinvm}" > "${yinvm}.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Yin ${version}" \
            --generate-notes \
            --verify-tag
