name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  native:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            suffix: ''
          - os: macos-latest
            platform: macos-arm64
            suffix: ''
          - os: windows-latest
            platform: windows-x86_64
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo build --release --workspace
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        run: |
          mkdir release
          cp target/release/yin "release/yin-${GITHUB_REF_NAME#v}-${{ matrix.platform }}"
          cp target/release/yinvm "release/yinvm-${GITHUB_REF_NAME#v}-${{ matrix.platform }}"
          cd release
          shasum -a 256 * > SHA256SUMS-${{ matrix.platform }}.txt
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release
          $version = $env:GITHUB_REF_NAME.Substring(1)
          Copy-Item target/release/yin.exe "release/yin-$version-${{ matrix.platform }}.exe"
          Copy-Item target/release/yinvm.exe "release/yinvm-$version-${{ matrix.platform }}.exe"
          Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content "release/SHA256SUMS-${{ matrix.platform }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: release/*

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci && npm run package
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: editor
          path: editors/vscode/yin-language-support-*.vsix

  publish:
    needs: [native, editor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Validate version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).packages.find(p=>p.name==="yin-language").version))')"
          test "$version" = "$cargo_version"
          test "$version" = "$(node -p "require('./editors/vscode/package.json').version")"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Yin ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
