name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode verify

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install editor dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Package editor extension
        working-directory: editors/vscode
        run: npm run package
      - name: Verify editor package
        run: |
          version="$(node -p "require('./editors/vscode/package.json').version")"
          .github/scripts/verify-vsix.sh \
            "$version" \
            "editors/vscode/yin-language-support-${version}.vsix"
