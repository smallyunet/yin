name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify native runtime
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo build --release --workspace
          .github/scripts/verify-rust-runtime.sh 0.22.0
          .github/scripts/verify-rust-vm.sh 0.22.0
          .github/scripts/verify-v019-test-migration.sh
          .github/scripts/verify-v019-differential.sh
      - name: Verify Rust/Wasm runtime
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          cargo build --release --target wasm32-unknown-unknown --lib
          wasm-bindgen target/wasm32-unknown-unknown/release/yin.wasm \
            --out-dir site/runtime --out-name yin --target no-modules --no-typescript
          node --check site/app.js
          node --check site/worker.js
          node .github/scripts/browser-runtime-smoke.cjs

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
      - run: .github/scripts/verify-vsix.sh 0.22.0 editors/vscode/yin-language-support-0.22.0.vsix
