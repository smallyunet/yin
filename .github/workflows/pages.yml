name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: cargo build --release --target wasm32-unknown-unknown --lib
      - name: Build browser runtime
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/yin.wasm \
            --out-dir site/runtime --out-name yin --target no-modules --no-typescript
          node .github/scripts/browser-runtime-smoke.cjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
